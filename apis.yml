name: Synthekine
description: >-
  Synthekine is a clinical-stage biotechnology company discovering, developing,
  and commercializing the next generation of selective cytokine therapeutics.
  The company believes cytokine therapeutics engineered to be selective can
  fundamentally change the treatment paradigm for cancer and inflammatory
  disease. Synthekine's engineering platforms (including its surrogate/partial
  agonist and orthogonal cytokine-receptor approaches) are used to design
  cytokines and cytokine-based cell therapies with improved selectivity and
  tolerability. Backed by Canaan Partners and added to the API Evangelist
  network as a company profile; Synthekine is a therapeutics developer and
  publishes no public developer API surface at this time.
